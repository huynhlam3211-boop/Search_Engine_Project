# history-service :8085

spring.config.import=classpath:vnsearch-common.properties

spring.application.name=history-service
server.port=${SERVER_PORT:8085}

# ---MongoDB---
spring.data.mongodb.uri={$MONGO_URI:mongodb://mongo:27017/vnsearch_history}

spring.data.mongodb.auto-index-creation=true

# ---security---
app.security.require-admin-api-key=false
# ---Memory---
# 384MB

#Lõi nghiệp vụ (nơi HistoryService sống):
#- src/main/java/com/vnsearch/history/HistoryService.java — nghiệp vụ chính: ghi/gộp lượt ghé, ghi/gộp truy vấn, phân trang, gợi ý, xoá theo id/khoảng thời gian
#- src/main/java/com/vnsearch/history/VisitDocument.java + VisitRepository.java — model & repo lượt ghé
#- src/main/java/com/vnsearch/history/SearchQueryDocument.java + SearchQueryRepository.java — model & repo truy vấn tìm kiếm

#Tầng HTTP gọi vào nó:
