# ============================================================================
# analytics-service :8084 — số liệu sử dụng và bảng điều khiển quản trị.
# ============================================================================
spring.config.import=classpath:vnsearch-common.properties

spring.application.name=analytics-service
server.port=${SERVER_PORT:8084}

app.security.require-admin-api-key=true

app.clients.crawler-service.url=${CRAWLER_SERVICE_URL:http://crawler-service:8083}
app.clients.auth-service.url=${AUTH_SERVICE_URL:http://auth-service:8081}

