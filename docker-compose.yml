
services:
  postgres:
    image: postgres:17-alpine
    container_name: vnsearch-postgres
    environment:
      POSTGRES_DB: vnsearch
      POSTGRES_USER: vnsearch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vnsearch}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./search-engine/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vnsearch -d vnsearch"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./search-engine
    container_name: vnsearch-backend
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false
    environment:
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Thieu ADMIN_API_KEY - xem README.md muc "Chay bang Docker"}
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vnsearch}
      APP_CRAWLER_BUS: ${APP_CRAWLER_BUS:-memory}
      APP_CRAWLER_KAFKA_BOOTSTRAP: kafka:9092

      APP_STORAGE_POSTGRES_ENABLED: "true"
      APP_STORAGE_POSTGRES_URL: jdbc:postgresql://postgres:5432/vnsearch
      APP_STORAGE_POSTGRES_USER: vnsearch
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173
      APP_RANKING_SCORER: tfidf
    ports:
      - "8080:8080"
    volumes:
      - ./search-engine/data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped


  kafka:
    image: apache/kafka:3.8.1
    container_name: vnsearch-kafka
    profiles: [kafka, monitoring]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 12
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_MESSAGE_MAX_BYTES: 4194304
      KAFKA_REPLICA_FETCH_MAX_BYTES: 4194304

      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xmx768m -Xms512m"
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: vnsearch-kafka-ui
    profiles: [kafka, monitoring]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: vnsearch
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8081:8080"
    restart: unless-stopped

  crawler-worker:
    build:
      context: ./search-engine
    container_name: vnsearch-crawler-worker
    profiles: [kafka, monitoring]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Thieu ADMIN_API_KEY - xem README.md muc "Chay bang Docker"}
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vnsearch}

      APP_CRAWLER_BUS: kafka
      APP_CRAWLER_KAFKA_BOOTSTRAP: kafka:9092
      APP_CRAWLER_ROLE: worker
      APP_CRAWLER_ROLE_IS_API: "false"

      APP_STORAGE_POSTGRES_ENABLED: "true"
      APP_STORAGE_POSTGRES_URL: jdbc:postgresql://postgres:5432/vnsearch
      APP_STORAGE_POSTGRES_USER: vnsearch
    volumes:
      - ./search-engine/data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped


  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: vnsearch-prometheus
    profiles: [monitoring]
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # o dia cua may ca nhan.
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: vnsearch-grafana
    profiles: [monitoring]
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/vnsearch.json
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: vnsearch-alertmanager
    profiles: [monitoring]
    volumes:
      - ./deploy/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    restart: unless-stopped

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: vnsearch-kafka-exporter
    profiles: [monitoring]
    depends_on:
      kafka:
        condition: service_healthy
    command: ["--kafka.server=kafka:9092"]
    ports:
      - "9308:9308"
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
